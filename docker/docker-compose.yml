version: '3.8'

services:
  neo4j:
    image: neo4j:5.20-enterprise
    container_name: neo4j-hoteles
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/test12345
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_EDITION=enterprise
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      # Los CSVs se toman de data/raw/ del proyecto
      - ../data/raw:/var/lib/neo4j/import
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 10s
      retries: 10

  neo4j-loader:
    build: ./loader
    container_name: neo4j-loader
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=test12345
    volumes:
      # Los CSVs montados en /data dentro del contenedor
      - ../data/raw:/data
    command: ["python", "load_databases.py"]

volumes:
  neo4j_data: